<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nodeable maps the producers, songwriters and musicians behind the songs you love." />
    <title>Nodeable</title>
    <!-- The display face is on the critical path of the first paint, so it is fetched early (decision 0020). The other fonts and subsets are fetched when text needs them. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
