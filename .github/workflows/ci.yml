name: CI

# Spec section 13: build, test and lint both halves in parallel. Every job maps to a requirement named in its steps.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (NFR-SEC-01): the workflow only reads the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: GitHub moves "latest" to a new Ubuntu release on its own
# schedule, and a new image can change tool versions under a green build. Move the pin by hand, in its own pull request.
jobs:
  backend:
    name: Backend (build, format, test, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Latest 10.0 SDK; global.json allows any 10.0.x feature band at or above its version.
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nodeable.slnx

      # Warnings are errors (Directory.Build.props), so this is also the C# analyser lint.
      - name: Build
        run: dotnet build Nodeable.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format Nodeable.slnx --no-restore --verify-no-changes

      # Integration tests start PostgreSQL with Testcontainers; the hosted runner provides Docker.
      - name: Test
        run: dotnet test --no-build --configuration Release

      # Spec section 13, CI step 2: Domain holds the rules (role mapping, dates, later scoring and path search), so it
      # must stay at or above 80% line coverage. Its tests are fast and need no containers, so they run again here with
      # a coverage report; the report is then read by a small script that fails the build under the minimum.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the coverage gate
        run: node --test "tools/ci/*.test.mjs"

      - name: Domain coverage gate (80%)
        run: |
          dotnet test --project tests/Nodeable.Domain.Tests --no-build --configuration Release \
            --coverage --coverage-output-format cobertura --coverage-output "$PWD/coverage/domain.cobertura.xml"
          node tools/ci/check-coverage.mjs coverage/domain.cobertura.xml Nodeable.Domain 80

      # NFR-SEC-04. `dotnet list package` exits 0 even when it finds advisories, so the output is checked.
      - name: Check NuGet packages for known vulnerabilities
        run: |
          dotnet list Nodeable.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found, see the log above"
            exit 1
          fi

  web:
    name: Web (typecheck, lint, test, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly what package-lock.json says and fails if it is out of sync with package.json.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Spec section 12 and decision 0002: JavaScript on first load stays under 250 KB gzipped.
      - name: Check first-load bundle budget
        run: node scripts/check-bundle-size.mjs 250

      # NFR-SEC-04
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  # The browser flow of the UI refresh (spec section 13, decision 0020): search, add, orbit, remove, in a real browser
  # against the production build, with the Api and the hub faked at the network edge (web/e2e/fakeApi.ts). The suite
  # against the whole stack with a recorded MusicBrainz is M4's. It is not run on a developer's machine by default.
  e2e:
    name: End to end (search, add, orbit, remove)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run the flow
        run: npm run e2e

      # The trace of a failed run shows every step with a screenshot, which is what a failure needs.
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  learning-tools:
    name: Learning anchors (well-formed, unique ids)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the anchors script
        run: node --test "tools/learning/*.test.mjs"

      # Spec section 16: every LEARN comment follows the fixed format and each id points at one place.
      - name: Check anchors
        run: node tools/learning/collect-anchors.mjs --check

  # NFR-SEC-01: a secret is caught before it is merged, and the repository is public (decision log, D6). The scan reads
  # the whole history, not only the pull request's commits, so a secret already in a branch's history is found too.
  # gitleaks runs from its official image at a fixed version instead of a third-party action: there is no licence key and
  # no action to trust. git is told the mounted checkout is safe (the image runs as root over a runner-owned directory), and the report redacts matches.
  secret-scan:
    name: Secrets (gitleaks over the whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks exits 0 and says "0 commits scanned" when git itself fails (for example on an ownership check), which would
      # be a green build that scanned nothing. So the step also fails on any error line and on an empty scan.
      - name: Scan the history
        run: |
          set +e
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --log-opts="--all" --redact --no-color --verbose > scan.log 2>&1
          status=$?
          cat scan.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -q " ERR " scan.log; then echo "::error::gitleaks reported an error"; exit 1; fi
          if ! grep -qE "INF [1-9][0-9]* commits scanned" scan.log; then echo "::error::gitleaks scanned no commits"; exit 1; fi

  api-contract:
    name: API contract (generated types are current)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Builds the Api (which writes its OpenAPI document) and regenerates web/src/api/schema.d.ts from it.
      - name: Regenerate API types
        working-directory: web
        run: npm run gen:api

      # Principle 6: if the Api's contract changed, the committed types and the committed contract file (docs/api/openapi.json,
      # which `gen:api` also writes) must change in the same pull request.
      - name: Fail if the generated types or the contract file changed
        run: git diff --exit-code -- web/src/api/schema.d.ts docs/api/openapi.json

      # Spec section 13, step 3: a breaking change to the contract fails the pull request unless info.version changed too
      # (ApiContract.Version). The base branch's committed file is the "before"; it does not exist in the first pull request
      # that adds the file, and the script says so and passes. The base branch name goes through an environment variable, not
      # into the script text.
      - name: Compare the contract with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/base"
          git show "FETCH_HEAD:docs/api/openapi.json" > "$RUNNER_TEMP/base/openapi.json" || rm -f "$RUNNER_TEMP/base/openapi.json"
          node tools/ci/check-openapi-breaking.mjs "$RUNNER_TEMP/base/openapi.json" docs/api/openapi.json

  # Spec section 13, CI step 4 (decisions 0024 and 0029): each image is built for both architectures, checked, and scanned.
  # The production host is arm64 (Oracle Ampere), the runners are amd64, so arm64 is built the cheap way: the SDK stage runs
  # natively and publishes for arm64 (see the Dockerfiles), and only the final stage is emulated. Nothing is pushed here: a
  # registry and a place to pull from arrive with the deployment pull request. Like the gitleaks job, the tools run from
  # their official images at fixed versions, so there is no third-party action to trust.
  images:
    name: Image ${{ matrix.image }} (build for arm64 and amd64, check, scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: src/Nodeable.Api/Dockerfile
            context: .
            non_root: true
          - image: worker
            file: src/Nodeable.Worker/Dockerfile
            context: .
            non_root: true
          # Caddy is built from source in this Dockerfile (decision 0029) and runs as the user caddy.
          - image: web
            file: web/Dockerfile
            context: web
            non_root: true
    steps:
      - uses: actions/checkout@v7

      # Lets the amd64 runner run arm64 containers for the checks below. The tag is a fixed QEMU version.
      - name: Register QEMU for arm64
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64

      - name: Create a builder
        run: docker buildx create --name nodeable --driver docker-container --use

      # Layers are cached on disk between runs (a plain directory, so no extra action's runtime variables are needed). A run
      # writes a new cache and swaps it in, so the cache does not grow without bound.
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: images-${{ matrix.image }}-${{ hashFiles(matrix.file, 'Directory.Packages.props', 'web/package-lock.json') }}
          restore-keys: images-${{ matrix.image }}-

      - name: Build for both architectures
        env:
          CACHE: ${{ runner.temp }}/buildx-cache
        run: |
          for arch in amd64 arm64; do
            docker buildx build --builder nodeable --platform "linux/$arch" \
              -f "${{ matrix.file }}" -t "nodeable-${{ matrix.image }}:$arch" \
              --cache-from "type=local,src=$CACHE/$arch" --cache-to "type=local,dest=$CACHE-new/$arch,mode=max" \
              --load "${{ matrix.context }}"
          done
          rm -rf "$CACHE" && mv "$CACHE-new" "$CACHE"

      # The image is for the right machine: the .NET host reports its architecture (it runs under QEMU for arm64), and the
      # web image holds the built site. A wrong-architecture image would fail on the Oracle host and nowhere before it.
      - name: Check the architecture
        run: |
          for arch in amd64 arm64; do
            image="nodeable-${{ matrix.image }}:$arch"
            if [ "${{ matrix.image }}" = "web" ]; then
              # The single quotes are on purpose: the command is for the shell inside the container, not this one.
              # shellcheck disable=SC2016
              docker run --rm --platform "linux/$arch" --entrypoint /bin/sh "$image" -c 'test -f /srv/index.html && uname -m'
            else
              docker run --rm --platform "linux/$arch" --entrypoint dotnet "$image" --info | tee info.txt
              expected=$([ "$arch" = "arm64" ] && echo arm64 || echo x64)
              grep -E "^\s*Architecture:\s+$expected\s*$" info.txt
            fi
          done

      - name: Check that the app does not run as root
        if: matrix.non_root
        run: |
          for arch in amd64 arm64; do
            user=$(docker image inspect --format '{{.Config.User}}' "nodeable-${{ matrix.image }}:$arch")
            echo "$arch runs as: $user"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then echo "::error::The $arch image runs as root"; exit 1; fi
          done

      # High and critical findings that have a fix fail the build; one with no fix yet cannot be acted on and is left out. An
      # exception is written in .trivyignore with a reason and an expiry date, never by loosening this step.
      - name: Scan for vulnerabilities
        run: |
          for arch in amd64 arm64; do
            docker save "nodeable-${{ matrix.image }}:$arch" -o "image-$arch.tar"
            docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work aquasec/trivy:0.75.0 image --input "image-$arch.tar" \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --ignorefile .trivyignore
          done

  # The workflow files are code that nothing else checks: actionlint finds a misspelt key or a bad expression before a run
  # does. It runs from its official image at a fixed version.
  workflow-lint:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflow files
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # Spec section 12 (performance budgets) and NFR-PERF-04: Lighthouse performance of the production build's home page
  # must be 90 or better. Three runs, median score, on the mobile profile (slow 4G, a slowed CPU), which is the
  # stricter of Lighthouse's two. The page is the one a first-time visitor sees: no graph, so no Api is needed.
  # @lhci/cli is run with npx at a fixed version instead of being added to web/package.json, so its large dependency
  # tree (a headless-browser driver) stays out of the lock file and out of `npm audit`.
  lighthouse:
    name: Lighthouse (home page performance 90 or better)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The hosted runner has Google Chrome installed; lighthouserc.json starts it headless and without the sandbox
      # (a container's user namespaces do not allow Chrome's own).
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Show the scores
        if: always()
        run: |
          # The single quotes are on purpose: the program is JavaScript, and its ${...} are not the shell's.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("lighthouse-report/manifest.json", "utf8"));
            const run = manifest.find((entry) => entry.isRepresentativeRun) ?? manifest[0];
            const rows = Object.entries(run.summary).map(([name, score]) => `| ${name} | ${Math.round(score * 100)} |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["### Lighthouse (median run)", "", "| Category | Score |", "| --- | ---: |", ...rows, ""].join("\n"));
          '

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: web/lighthouse-report
          if-no-files-found: ignore
