# NFR-SEC-04: dependencies are kept current so known vulnerabilities do not linger.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Decision 0013: these majors are held until eslint-plugin-jsx-a11y declares ESLint 10 support and
    # typescript-eslint supports TypeScript 6.1 or later. Review the pins at the start of each milestone.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Decision 0013: @types/node describes the Node runtime's API, so its major follows the runtime (Node 24, set
      # by node-version in .github/workflows/ci.yml), not the newest Node. Minor and patch updates still flow.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
