# NFR-SEC-04: dependencies are kept current so known vulnerabilities do not linger.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Decision 0013: TypeScript is held until typescript-eslint supports 6.1 or later. Review the pin at the
      # start of each milestone. (ESLint is no longer held: decision 0014 moved to ESLint 10.)
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Decision 0013: @types/node describes the Node runtime's API, so its major follows the runtime (Node 24, set
      # by node-version in .github/workflows/ci.yml), not the newest Node. Minor and patch updates still flow.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
